services:
  # PostgreSQL Database for Sports Data
  sportsdb:
    # Pinned major version (15) on Alpine keeps the image small and upgrades predictable.
    image: postgres:15-alpine
    container_name: sportsdb
    environment:
      # The password comes from the environment / a local .env file (copy .env.example to .env).
      # The ':?' form makes `docker compose` abort with this message when it is unset, so there
      # is no insecure default. .env is git-ignored; never commit a real password.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: sportsdata
    volumes:
      # Named volume so database contents survive container recreation.
      - sportsdb_data:/var/lib/postgresql/data
    ports:
      # Publishes Postgres on the host for local tools; remove to keep it internal to the network.
      - "5432:5432"
    networks:
      - data-pipeline-network
    # pg_isready makes dependents wait until the database actually accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Python Sports Data Service
  sportsservice:
    build:
      # Build context is the service directory; the Dockerfile there installs requirements.txt.
      context: ./SportsService
      dockerfile: Dockerfile
    container_name: sportsservice
    environment:
      # Host 'sportsdb' resolves through the compose network by service name. The password is
      # interpolated from the same variable as the database container, so the two cannot drift.
      # Use a password without URL-special characters (@ : / ? #) or percent-encode it.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@sportsdb:5432/sportsdata
      PYTHONUNBUFFERED: 1
      # Browser origins allowed to call the API (comma separated; '*' is rejected).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
      # Secret for DELETE /api/sports/cleanup (send as X-API-Key). Empty = that route returns 503.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "5001:5001"
    depends_on:
      sportsdb:
        # Start only after the database healthcheck passes (plain depends_on would not wait).
        condition: service_healthy
    networks:
      - data-pipeline-network
    restart: unless-stopped
    volumes:
      # Read-only bind mount overlays the image's /app with the local source, so edits show up
      # without a rebuild. It is read-only, so the app cannot write files there.
      - ./SportsService:/app:ro

  # C# Coordinate Ping Service
  pingservice:
    build:
      context: ./PingService
      dockerfile: Dockerfile
    container_name: pingservice
    environment:
      # Standard ASP.NET Core settings: run in Production mode and listen on plain HTTP port 5000.
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      # Browser origins allowed by PingService's CORS policy (comma separated).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
    ports:
      - "5000:5000"
    networks:
      - data-pipeline-network
    restart: unless-stopped
    depends_on:
      # Start order only (no health condition): PingService does not wait for the sports API to be ready.
      - sportsservice

networks:
  data-pipeline-network:
    # Single user-defined bridge network shared by all three services.
    driver: bridge
    name: data-pipeline-network

volumes:
  sportsdb_data:
    name: sportsdb_data
